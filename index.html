<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liberate Universe</title>
    <meta name="description" content="Liberate Universe — Privacy Policy and legal information.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf9f7;
            color: #242424;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border: 1px solid #e8e5df;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
        }

        .brand {
            color: #6b4eff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 42px;
            line-height: 1.15;
            letter-spacing: -0.03em;
        }

        p {
            color: #666666;
            font-size: 17px;
            line-height: 1.7;
            margin: 0 auto 30px;
            max-width: 520px;
        }

        .button {
            display: inline-block;
            background: #6b4eff;
            color: #ffffff;
            padding: 13px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }

        .button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 35px;
            color: #888888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 38px 24px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="brand">Liberate Universe</div>

        <h1>Legal & Privacy</h1>

        <p>
            This website provides legal and privacy information
            relating to Liberate Universe and its digital products
            and services.
        </p>

        <a class="button" href="privacy-policy.html">
            View Privacy Policy
        </a>

        <footer>
            © 2026 Liberate Universe. All rights reserved.
        </footer>

    </main>

</body>
</html>
